[project]
name = "mtu-campuslens-api"
version = "1.0.0"
description = "MTU CampusLens JSON-backed FastAPI API with Agent Skills"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
]

[tool.vercel]
# The backend Vercel project must have Root Directory set to repository root.
# This preserves access to .agents/skills and backend/app/data/buildings.json.
entrypoint = "backend.app.main:app"
