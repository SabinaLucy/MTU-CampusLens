name: CampusLens regression
on:
  push:
    branches: [campuslens-upgrade]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: python -m compileall -q app && python -m pytest -q tests/test_conversation_regression.py tests/test_agents.py
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: frontend
