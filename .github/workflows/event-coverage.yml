name: Audit live event coverage
on:
  push:
    branches: [campuslens-upgrade]
    paths: ['backend/app/services/live_events.py','.github/workflows/event-coverage.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx icalendar
      - run: PYTHONPATH=. python scripts/audit_events.py > event-audit.json
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: event-coverage
          path: backend/event-audit.json
