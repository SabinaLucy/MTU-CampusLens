name: Audit and enrich seven campus buildings
on:
  push:
    branches: [campuslens-upgrade]
    paths: ['backend/scripts/enrich_seven.py','.github/workflows/enrich-seven.yml']
permissions:
  contents: write
jobs:
  directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4 pillow
      - run: python backend/scripts/enrich_seven.py
      - uses: actions/upload-artifact@v4
        with:
          name: directory-audit
          path: directory-audit.json
      - run: |
          git config user.name "CampusLens research"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/data/buildings.json frontend/public
          git diff --cached --quiet || git commit -m "Add source-matched building personnel and local photos"
          git push origin HEAD:campuslens-upgrade
